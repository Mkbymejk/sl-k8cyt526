<style>
:root{color-scheme:light dark;--bg:light-dark(#f4efe6,#0f1b1d);--card:light-dark(#fffaf2,#16272a);--ink:light-dark(#13201f,#eef3ef);--mute:light-dark(#5d6b68,#9fb3ae);--line:light-dark(#e2d8c8,#24393c);--acc:#ff6b4a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
.c{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;text-align:center}
img{width:76px;height:76px;border-radius:18px}
h1{margin:12px 0 4px;font-size:28px}
p{margin:0 0 18px;color:var(--mute)}
input{width:100%;font:16px system-ui,sans-serif;padding:12px 14px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
button{width:100%;margin-top:12px;font:600 17px system-ui,sans-serif;min-height:52px;border-radius:14px;border:0;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#e{min-height:22px;margin-top:10px;color:var(--acc);font-size:14px}
</style>
</head>

const en=!/^de\b/i.test(navigator.language||'');
if(en){document.documentElement.lang='en';document.getElementById('t').textContent='Access with password only';document.getElementById('b').textContent='Open';document.getElementById('pw').setAttribute('aria-label','Password')}
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct)));
  try{localStorage.setItem('sl-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
const tryPw=async(pw,quiet)=>{const b=document.getElementById('b');b.disabled=true;
  try{await open(pw);return true}catch(e){if(!quiet)document.getElementById('e').textContent=en?'Wrong password.':'Falsches Passwort.';try{if(quiet)localStorage.removeItem('sl-pw')}catch(_){}}
  b.disabled=false;return false};
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('pw').value.trim();if(v)tryPw(v)});
(async()=>{
  if(location.hash){history.replaceState(null,'',location.pathname)}
  let s=null;try{s=localStorage.getItem('sl-pw')}catch(e){}
  if(s&&await tryPw(s,true))return;
  if(!crypto.subtle){document.getElementById('e').textContent=en?'Please open the page via https.':'Bitte die Seite über https öffnen.'}
})();
}
